<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎃 Halloween Countdown 2027</title>
<meta name="description" content="Live countdown to Halloween — October 31, 2027.">
<meta property="og:title" content="🎃 Halloween Countdown 2027">
<meta property="og:description" content="How long until Halloween? Tap to see the live countdown. 👻">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jellomel.github.io/halloween-countdown/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="🎃 Halloween Countdown 2027">
<meta name="twitter:description" content="How long until Halloween? Tap to see the live countdown. 👻">
<meta name="theme-color" content="#100818">
<meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden;color:#fff;background:linear-gradient(rgba(12,5,19,.43),rgba(12,5,19,.65)),url("Sleeping%20Tabby%20in%20a%20Haunted%20Graveyard.png") center center / cover fixed no-repeat,radial-gradient(circle at 50% 15%,#4b1b5e 0,#21102f 28%,#0c0711 72%)}
.scene{width:min(94vw,920px);text-align:center;padding:32px 18px 42px;position:relative;isolation:isolate;text-shadow:0 2px 12px #12091b}.moon{display:none;position:absolute;width:150px;height:150px;border-radius:50%;background:#f6c86b;filter:drop-shadow(0 0 25px #d78536);top:-55px;right:2%;opacity:.9;z-index:-1}.bat{display:none;position:absolute;font-size:26px;opacity:.7}.b1{top:30px;left:8%}.b2{top:80px;right:19%;font-size:19px}.b3{top:125px;left:20%;font-size:17px}.pumpkin{font-size:76px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 5px 15px #000)}h1{margin:0;font-size:clamp(32px,8vw,62px);letter-spacing:-1px;text-shadow:0 3px 0 #000}.date{margin:8px 0 28px;color:#efb965;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.unit{background:rgba(13,7,18,.88);border:1px solid rgba(239,185,101,.3);border-radius:18px;padding:19px 6px 16px;box-shadow:0 12px 35px rgba(0,0,0,.32);backdrop-filter:blur(6px)}.number{display:block;font-size:clamp(32px,9vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.label{display:block;margin-top:8px;color:#cbbbcf;text-transform:uppercase;font-size:11px;letter-spacing:.13em}.message{margin:24px 0 0;font-size:16px;color:#ddd0e1}.footer{margin-top:35px;font-size:12px;color:#8e7d95}.ground{position:fixed;bottom:0;left:0;right:0;height:35px;background:#050407;border-radius:50% 50% 0 0/60% 60% 0 0;z-index:-1}@media(max-width:480px){.scene{padding-inline:10px}.countdown{gap:6px}.unit{border-radius:13px;padding:16px 2px 13px}.label{font-size:9px}.pumpkin{font-size:65px}}
@media(max-width:600px){body{background-attachment:scroll;background-position:center center}.scene{padding-block:50px}.countdown{gap:6px}.unit{padding:14px 3px}}
</style>
</head>
<body>
<main class="scene">
<div class="moon" aria-hidden="true"></div><span class="bat b1" aria-hidden="true">🦇</span><span class="bat b2" aria-hidden="true">🦇</span><span class="bat b3" aria-hidden="true">🦇</span>
<div class="pumpkin" aria-hidden="true">🎃</div>
<h1>Halloween Countdown</h1>
<p class="date">October 31, 2027</p>
<section class="countdown" aria-label="Time remaining until Halloween 2027">
<div class="unit"><span class="number" id="days">--</span><span class="label">Days</span></div>
<div class="unit"><span class="number" id="hours">--</span><span class="label">Hours</span></div>
<div class="unit"><span class="number" id="minutes">--</span><span class="label">Minutes</span></div>
<div class="unit"><span class="number" id="seconds">--</span><span class="label">Seconds</span></div>
</section>
<p class="message" id="message">Until the spooky season reaches its big night 👻</p>
<p class="footer">Live countdown to Halloween 2027 • Updates every second</p>
</main><div class="ground" aria-hidden="true"></div>
<script>
(()=>{const d=document.getElementById('days'),h=document.getElementById('hours'),m=document.getElementById('minutes'),s=document.getElementById('seconds'),msg=document.getElementById('message');const target=new Date(2027,9,31,0,0,0);const pad=n=>String(n).padStart(2,'0');function tick(){let x=target-Date.now();if(x<=0){d.textContent='0';h.textContent=m.textContent=s.textContent='00';msg.textContent='Happy Halloween! 🎃👻';return false}d.textContent=Math.floor(x/86400000);x%=86400000;h.textContent=pad(Math.floor(x/3600000));x%=3600000;m.textContent=pad(Math.floor(x/60000));s.textContent=pad(Math.floor((x%60000)/1000));return true}if(tick()){const t=setInterval(()=>{if(!tick())clearInterval(t)},1000)}})();
</script>
</body>
</html>
